name: Feedback
description: Voluntary feedback after trying the tool
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. This is optional. **Do not send private data** (issues are public): describe your use without naming non-public sites, people or cookie values.
  - type: dropdown
    id: usage
    attributes:
      label: Did you use it on a real page?
      options: ["Yes, on a public page", "Yes, on a non-public page (not named)", "Only on the synthetic test page", "Not yet"]
    validations: { required: true }
  - type: textarea
    id: useful
    attributes:
      label: "What was useful, what was missing or confusing?"
    validations: { required: true }
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This feedback contains no private data
          required: true
